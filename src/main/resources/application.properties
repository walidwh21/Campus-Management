spring.application.name=campus-api
server.port=${SERVER_PORT:8082}

# --- datasource (override through environment variables) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/campusdb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# --- token signing: REQUIRED, at least 32 characters ---
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl-minutes=${JWT_TTL_MINUTES:480}
